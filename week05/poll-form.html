<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <label for="fullname">Full Name: <input type="text" id="fullname" name="fullname"
                  required>
            </label>

            <label for="useremail">Email: </label>
            <input type="email" id="useremail" name="useremail" placeholder="ifeanyi@gmail.com"
              required>

            <label for="browser"> What is your favourite internet browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="others">Other</option>
            </select>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the place you have lived:</label>
            <textarea name="feedback" id="feedback" rows="4"
              placeholder="stillwater florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
