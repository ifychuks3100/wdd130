<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <div class="column1">
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email: </label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </div>

            <div class="questions">
                <div class="form-item second">
                    <label for="browser"> What is your favourite internet browser?
                    </label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="others">Other</option>
                    </select>
                </div>
                <div class="form-item second">
                    <label for="pet">Do you have a household pet? </label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item second">
                    <label for="feedback">List the place you have lived:</label>

                </div>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="stillwater florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>

            </div>


            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
